<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>TIKUM Operations Console — Admin Sign In</title>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #0f172a;
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px 24px;
    }
    .brand {
      text-align: center;
      margin-bottom: 20px;
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--accent);
      font-size: 20px;
      margin-bottom: 10px;
    }
    .brand h1 {
      font-size: 15px;
      margin: 0;
      letter-spacing: 0.4px;
    }
    .brand p {
      margin: 4px 0 0;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
      font-weight: 600;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 14px 0 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 13px;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 11px 12px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #06263a;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 6px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: var(--danger);
      font-size: 12px;
    }
    .footnote {
      margin-top: 18px;
      text-align: center;
      font-size: 11px;
      color: #64748b;
    }
    .footnote a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div style="position: absolute; top: 16px; right: 20px;">
    <button id="langToggle" onclick="window.TikumI18n ? window.TikumI18n.toggleLang() : null" style="background:#1e293b; border:1px solid #334155; color:#38bdf8; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:700; cursor:pointer;" title="Switch Language">ID</button>
  </div>
  <main class="login-card">
    <div class="brand">
      <div class="brand-badge">&#128737;</div>
      <h1 data-i18n="admin.consoleTitle">TIKUM OPERATIONS CONTROL</h1>
      <p data-i18n="admin.consoleSubtitle">Admin Sign In</p>
    </div>

    <form id="adminLoginForm" autocomplete="on">
      <label for="email" data-i18n="auth.emailLabel">Email</label>
      <input type="email" id="email" name="email" required autocomplete="username" placeholder="nama@tikum.app" data-i18n-placeholder="auth.emailPlaceholder">

      <label for="password" data-i18n="auth.passwordLabel">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" data-i18n-placeholder="auth.passwordPlaceholder">

      <button type="submit" id="loginButton" data-i18n="auth.signInBtn">Masuk</button>
    </form>

    <div id="loginError" class="error" role="alert"></div>

    <div class="footnote">
      <span data-i18n="auth.adminAccessFootnote">Akses terbatas untuk ADMIN / OPS / TRUST_OFFICER / SUPER_ADMIN.</span><br>
      <a href="/" data-i18n="auth.returnToHomepage">Kembali ke halaman utama</a>
    </div>
  </main>

  <script src="/js/i18n.js"></script>
  <script>
    (function () {
      var form = document.getElementById('adminLoginForm');
      var button = document.getElementById('loginButton');
      var errorBox = document.getElementById('loginError');

      var params = new URLSearchParams(window.location.search);
      var queryError = params.get('error');
      if (queryError === 'ADMIN_ACCESS_REQUIRED') {
        showError(window.TikumI18n ? window.TikumI18n.translateError('ADMIN_ACCESS_REQUIRED') : 'Akun ini tidak memiliki akses ke Operations Console.');
      } else if (queryError === 'USER_SUSPENDED') {
        showError(window.TikumI18n ? window.TikumI18n.translateError('USER_SUSPENDED') : 'Akun ini sedang ditangguhkan. Hubungi super admin.');
      }

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = 'block';
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        errorBox.style.display = 'none';
        button.disabled = true;
        button.textContent = window.TikumI18n ? window.TikumI18n.t('auth.verifying', 'Memverifikasi...') : 'Memverifikasi...';

        try {
          var res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
              email: document.getElementById('email').value.trim(),
              password: document.getElementById('password').value
            })
          });

          var data = null;
          try { data = await res.json(); } catch (e) {}

          if (res.ok) {
            var next = params.get('next');
            window.location.href = (next && next.charAt(0) === '/') ? next : '/admin';
            return;
          }

          if (res.status === 403) {
            showError((data && data.error) ? (window.TikumI18n ? window.TikumI18n.translateError(data.code || 'FORBIDDEN', data.error) : data.error) : 'Akun ini tidak memiliki akses admin.');
          } else if (res.status === 401) {
            showError(window.TikumI18n ? window.TikumI18n.translateError('INVALID_CREDENTIALS') : 'Email atau password salah.');
          } else {
            showError((data && data.error) || ('Login gagal (HTTP ' + res.status + ').'));
          }
        } catch (err) {
          showError(window.TikumI18n ? window.TikumI18n.translateError('NETWORK_ERROR') : 'Tidak dapat menghubungi server. Coba lagi.');
        } finally {
          button.disabled = false;
          button.textContent = window.TikumI18n ? window.TikumI18n.t('auth.signInBtn', 'Masuk') : 'Masuk';
        }
      });
    })();
  </script>
</body>
</html>
