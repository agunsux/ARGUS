<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Rinjani 100 Marvelous Trail 2027 - Lombok Timur">
  <defs>
    <linearGradient id="bgRinjani" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172333" />
      <stop offset="55%" stop-color="#15365B" />
      <stop offset="100%" stop-color="#172333" />
    </linearGradient>
    <radialGradient id="glowRinjani" cx="50%" cy="36%" r="58%">
      <stop offset="0%" stop-color="#E36F45" stop-opacity="0.26" />
      <stop offset="50%" stop-color="#24364D" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#172333" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ruleRinjani" x1="0%" y1="0%" x2="100%" y2="0%">
