<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="roundTop">
      <rect x="100" y="80" width="200" height="160" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <!-- Ticket body (rounded rect top) -->
  <rect x="100" y="80" width="200" height="160" rx="28" ry="28" fill="#5533FF"/>

  <!-- Notch left -->
  <circle cx="100" cy="175" r="18" fill="white"/>

  <!-- Notch right -->
  <circle cx="300" cy="175" r="18" fill="white"/>

  <!-- Perforation dashes -->
  <line x1="118" y1="175" x2="282" y2="175"
        stroke="white" stroke-width="5"
        stroke-dasharray="14,10"
        stroke-linecap="round"/>

  <!-- Pin tail (triangle pointing down from ticket bottom-center) -->
  <polygon points="160,240 240,240 200,330" fill="#5533FF"/>

  <!-- Pin tail connector smooth (no gap) -->
  <rect x="160" y="232" width="80" height="12" fill="#5533FF"/>
</svg>
