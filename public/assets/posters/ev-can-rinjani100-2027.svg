  <!-- Mountain ridge silhouette -->
  <path d="M 40 310 L 210 200 L 315 245 L 400 135 L 495 235 L 590 185 L 760 310 Z" fill="#24364D" fill-opacity="0.45" stroke="#E36F45" stroke-opacity="0.28" stroke-width="1.25" />
  <path d="M 110 310 L 265 225 L 400 165 L 545 245 L 690 310" fill="none" stroke="#F3EBDD" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4 6" />

  <rect x="20" y="20" width="760" height="410" rx="14" fill="none" stroke="#CBD5E1" stroke-opacity="0.16" stroke-width="1" />

  <g transform="translate(46, 44)">
