<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a1a1aa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#a1a1aa" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />
  <rect width="800" height="450" fill="url(#spotlight)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="rgba(255,255,255,0.08)" stroke="#a1a1aa" stroke-width="1.5" />
    <text x="65" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#a1a1aa" text-anchor="middle" letter-spacing="1.5">CONCERT</text>
  </g>

  <g transform="translate(620, 60)">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1" />
    <text x="65" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">ARENA TOUR</text>
  </g>

  <circle cx="400" cy="210" r="60" fill="rgba(255,255,255,0.03)" stroke="url(#glow)" stroke-width="2" />
  <text x="400" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="42" text-anchor="middle" fill="#a1a1aa">&#9729;</text>

  <text x="400" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">LANY: 'a beautiful blur' Tour</text>
  <text x="400" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle">Beach City International Stadium, Jakarta</text>

  <g transform="translate(250, 390)">
    <rect x="0" y="0" width="300" height="32" rx="6" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="150" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">TIKUM.APP • TRANSAKSI TERVERIFIKASI</text>
  </g>
</svg>