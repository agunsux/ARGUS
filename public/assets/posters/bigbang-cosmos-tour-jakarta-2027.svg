  <text x="400" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" fill="#E36F45" text-anchor="middle" letter-spacing="3.5">2026–2027 WORLD TOUR &lt; XX : COSMOS &gt;</text>
