<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="40%" stop-color="#180b33" />
      <stop offset="75%" stop-color="#0f0f12" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#ca8a04" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bbBg)" />
  <circle cx="300" cy="270" r="320" fill="url(#goldGlow)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="552" height="752" rx="12" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Geometric Cosmos Ray Pattern -->
  <g opacity="0.15" fill="#facc15">
    <polygon points="300,270 80,0 140,0" />
    <polygon points="300,270 460,0 520,0" />
    <polygon points="300,270 200,0 240,0" />
    <polygon points="300,270 360,0 400,0" />
    <circle cx="300" cy="270" r="220" stroke="#eab308" stroke-width="1" stroke-dasharray="4 6" fill="none" />
    <circle cx="300" cy="270" r="150" stroke="#fef08a" stroke-width="1" stroke-opacity="0.4" fill="none" />
  </g>

  <!-- Top Event Brief Tag -->
  <g transform="translate(300, 150)">
    <rect x="-160" y="-14" width="320" height="28" rx="6" fill="rgba(24, 24, 27, 0.85)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1" />
    <text text-anchor="middle" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#facc15" letter-spacing="2">TIKUM EVENT BRIEF · INFORMASI RESMI</text>
  </g>

  <!-- Concert Titles -->
  <text x="300" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#goldTextGrad)" letter-spacing="4">BIGBANG</text>
  <text x="300" y="315" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#fef08a" letter-spacing="6">2026–2027 WORLD TOUR</text>
  <text x="300" y="352" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="5">&lt; XX : COSMOS &gt;</text>
  <text x="300" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#eab308" letter-spacing="4">IN JAKARTA</text>

  <!-- Divider Line -->
  <line x1="160" y1="420" x2="440" y2="420" stroke="url(#goldAccent)" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Lineup -->
  <text x="300" y="460" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a1a1aa" letter-spacing="3">G-DRAGON • TAEYANG • DAESUNG</text>

  <!-- Schedule & Venue Information -->
  <g transform="translate(300, 530)">
    <rect x="-190" y="-30" width="380" height="150" rx="10" fill="rgba(24, 24, 27, 0.6)" stroke="#3f3f46" stroke-width="1" />
    <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#fef08a">
      16 &amp; 17 JANUARI 2027 • 19:00 WIB
    </text>
    <text text-anchor="middle" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e4e4e7">
      JAKARTA INTERNATIONAL STADIUM (JIS)
    </text>
    <text text-anchor="middle" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#a1a1aa">
      JAKARTA UTARA, INDONESIA
    </text>
    <text text-anchor="middle" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="1.5">
      MITRA TIKET RESMI: LOKET.COM
    </text>
  </g>

  <!-- Bottom Truthfulness Note -->
  <g transform="translate(300, 745)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#71717a" letter-spacing="1">
      POSTER RESMI BELUM DITERBITKAN · JADWAL TERKONFIRMASI DARI MITRA TIKET RESMI
    </text>
  </g>
</svg>
