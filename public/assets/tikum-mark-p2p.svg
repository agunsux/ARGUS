<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- LEFT PERSON — body (large circle) -->
  <circle cx="148" cy="240" r="72" fill="#4C2EE8"/>
  <!-- LEFT PERSON — head -->
  <circle cx="148" cy="148" r="34" fill="#4C2EE8"/>

  <!-- RIGHT PERSON — body (large circle) -->
  <circle cx="252" cy="240" r="72" fill="#4C2EE8"/>
  <!-- RIGHT PERSON — head -->
  <circle cx="252" cy="148" r="34" fill="#4C2EE8"/>

  <!-- MEETING DOT (coral accent, center where two bodies meet) -->
  <circle cx="200" cy="240" r="22" fill="#FF5F3E"/>
  <!-- Inner ring of meeting dot (white) for depth -->
  <circle cx="200" cy="240" r="10" fill="white"/>

</svg>
