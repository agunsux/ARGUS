name: TIKUM Automation Engine

on:
  schedule:
    # 1. Weekly Event Lifecycle Archival: Monday 00:05 WIB (Sunday 17:05 UTC)
    - cron: '5 17 * * 0'
    # 2. Twice-Weekly SEO Blog Engine: Tuesday & Friday 09:00 WIB (02:00 UTC)
    - cron: '0 2 * * 2,5'
    # 3. Bi-Weekly Primary Ticketing Event Scanner: 1st & 15th of month 03:00 WIB (previous day 20:00 UTC)
    - cron: '0 20 14,31 * *'
    - cron: '0 20 1,15 * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Automation Job to Trigger'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - archive-past-events
          - scan-primary-events
          - publish-seo-blog
      force:
        description: 'Force execution regardless of cadence cache'
        required: false
        default: false
        type: boolean

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Automation via Script
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TIKUM_BASE_URL: ${{ secrets.TIKUM_BASE_URL || 'https://tikum.app' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE_FLAG=""
            if [ "${{ github.event.inputs.force }}" = "true" ]; then
              FORCE_FLAG="--force"
            fi
            node scripts/run_automation.js --job "${{ github.event.inputs.job }}" $FORCE_FLAG
          else
            # Scheduled execution: run all automated sweeps
            node scripts/run_automation.js --job all
          fi
