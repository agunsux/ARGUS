<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18202c" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#e05a3a" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#e05a3a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#e05a3a" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad)" />
  <circle cx="200" cy="210" r="160" fill="url(#glowGrad)" />

  <!-- Geometric Pattern Lines -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <circle cx="200" cy="210" r="110" fill="none" stroke-dasharray="4 6" />
    <circle cx="200" cy="210" r="75" fill="none" />
    <line x1="60" y1="210" x2="340" y2="210" />
    <line x1="200" y1="70" x2="200" y2="350" />
  </g>

  <!-- Central Emblem -->
  <circle cx="200" cy="210" r="44" fill="#1e293b" stroke="url(#ringGrad)" stroke-width="2" />
  
  <!-- Music / Ticket Vector Icon -->
  <g transform="translate(185, 193) scale(1.3)" fill="#e05a3a">
    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
  </g>

  <!-- Brand Typography -->
  <text x="200" y="300" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="1">TIKUM KATALOG</text>
  <text x="200" y="324" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">EVENT RESMI TERVERIFIKASI</text>

  <!-- Shield Badge -->
  <g transform="translate(135, 430)">
    <rect width="130" height="26" rx="13" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="16" cy="13" r="5" fill="#34d399" />
    <text x="30" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1" letter-spacing="0.4">100% VERIFIED</text>
  </g>
</svg>
