  </g>

  <g transform="translate(400, 124)">
    <circle cx="0" cy="0" r="30" fill="#24364D" fill-opacity="0.9" stroke="#E36F45" stroke-width="1.5" />
    <text x="0" y="7" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#F3EBDD" text-anchor="middle" letter-spacing="1.5">100</text>
  </g>

  <text x="400" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">RINJANI 100</text>
  <text x="400" y="238" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#E36F45" text-anchor="middle" letter-spacing="4.5">MARVELOUS TRAIL 2027</text>
  <text x="400" y="264" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#F3EBDD" text-anchor="middle" letter-spacing="3">12K · 27K · 36K · 60K · 100K · 162K</text>

