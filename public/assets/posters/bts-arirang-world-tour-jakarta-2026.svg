<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="btsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518" />
      <stop offset="40%" stop-color="#180b33" />
      <stop offset="75%" stop-color="#120826" />
      <stop offset="100%" stop-color="#070311" />
    </linearGradient>
    <radialGradient id="btsGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#6d28d9" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="purpleTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="silverAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#btsBg)" />
  <circle cx="300" cy="140" r="260" fill="url(#btsGlow)" />

  <!-- Ambient Stage / Stadium Beams -->
  <g opacity="0.12" fill="#c084fc">
    <polygon points="300,140 100,0 160,0" />
    <polygon points="300,140 440,0 500,0" />
    <polygon points="300,140 220,0 260,0" />
    <polygon points="300,140 340,0 380,0" />
    <circle cx="300" cy="140" r="180" stroke="#a855f7" stroke-width="1" stroke-dasharray="4 6" fill="none" />
    <circle cx="300" cy="140" r="120" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5" fill="none" />
  </g>

  <!-- Top Promoter Tag -->
  <g transform="translate(300, 48)">
    <rect x="-140" y="-14" width="280" height="28" rx="6" fill="rgba(15, 7, 32, 0.6)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
    <text text-anchor="middle" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#c084fc" letter-spacing="2">BIGHIT MUSIC &amp; HYBE PRESENT</text>
  </g>

  <!-- Concert Titles -->
  <text x="300" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="url(#purpleTextGrad)" letter-spacing="4">BTS WORLD TOUR</text>
  <text x="300" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f3e8ff" letter-spacing="8">'ARIRANG' 2026</text>
  <text x="300" y="208" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a855f7" letter-spacing="3">IN JAKARTA</text>

  <!-- Divider Line -->
  <line x1="200" y1="225" x2="400" y2="225" stroke="url(#silverAccent)" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Concert Metadata Badge Strip -->
  <g transform="translate(300, 260)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e9d5ff">
      26 • 27 • 29 DESEMBER 2026
    </text>
    <text text-anchor="middle" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
      STADION UTAMA GELORA BUNG KARNO (GBK)
    </text>
    <text text-anchor="middle" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">
      OFFICIAL TICKETING PARTNER: TIKET.COM
    </text>
  </g>
</svg>
