    <text x="71" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#CBD5E1" text-anchor="middle" letter-spacing="1.2">JAKARTA · 2027</text>
  </g>

