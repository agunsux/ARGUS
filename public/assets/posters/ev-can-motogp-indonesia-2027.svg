<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Pertamina Grand Prix of Indonesia 2027 MotoGP Mandalika">
  <defs>
    <linearGradient id="bgMoto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172333" />
      <stop offset="52%" stop-color="#15365B" />
      <stop offset="100%" stop-color="#172333" />
    </linearGradient>
    <radialGradient id="glowMoto" cx="50%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#E36F45" stop-opacity="0.3" />
      <stop offset="48%" stop-color="#24364D" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#172333" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ruleMoto" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E36F45" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#E36F45" stop-opacity="1" />
      <stop offset="100%" stop-color="#F3EBDD" stop-opacity="0.15" />
    </linearGradient>
    <pattern id="gridMoto" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#CBD5E1" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgMoto)" />
  <rect width="800" height="450" fill="url(#glowMoto)" />
  <rect width="800" height="450" fill="url(#gridMoto)" />

  <!-- Racing circuit speed arcs -->
  <g fill="none">
    <path d="M 60 280 Q 400 70 740 280" stroke="#E36F45" stroke-opacity="0.28" stroke-width="2" />
    <path d="M 90 295 Q 400 100 710 295" stroke="#F3EBDD" stroke-opacity="0.18" stroke-width="1.25" stroke-dasharray="8 6" />
    <line x1="60" y1="150" x2="210" y2="150" stroke="#E36F45" stroke-opacity="0.3" stroke-width="2" />
    <line x1="590" y1="150" x2="740" y2="150" stroke="#E36F45" stroke-opacity="0.3" stroke-width="2" />
  </g>

  <rect x="20" y="20" width="760" height="410" rx="14" fill="none" stroke="#CBD5E1" stroke-opacity="0.16" stroke-width="1" />

  <g transform="translate(46, 44)">
    <rect x="0" y="0" width="128" height="28" rx="14" fill="#24364D" stroke="#E36F45" stroke-width="1.25" />
    <text x="64" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#F3EBDD" text-anchor="middle" letter-spacing="1.6">SPORTS</text>
  </g>
  <g transform="translate(584, 44)">
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#24364D" stroke="#CBD5E1" stroke-opacity="0.35" stroke-width="1" />
    <text x="85" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#CBD5E1" text-anchor="middle" letter-spacing="1.2">MANDALIKA · 2027</text>
  </g>

  <g transform="translate(400, 124)">
    <rect x="-56" y="-22" width="112" height="44" rx="10" fill="#24364D" fill-opacity="0.92" stroke="#E36F45" stroke-width="1.5" />
    <text x="0" y="7" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">MOTOGP</text>
  </g>

  <text x="400" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2.5">GRAND PRIX OF INDONESIA</text>
  <text x="400" y="238" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#E36F45" text-anchor="middle" letter-spacing="4">PERTAMINA MANDALIKA 2027</text>
  <text x="400" y="264" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#F3EBDD" text-anchor="middle" letter-spacing="3.5">ROUND 20 · WORLD CHAMPIONSHIP</text>

  <line x1="180" y1="286" x2="620" y2="286" stroke="url(#ruleMoto)" stroke-width="1.5" />

  <text x="400" y="318" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">29–31 OKTOBER 2027</text>
  <text x="400" y="342" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="middle">Pertamina Mandalika International Circuit · Lombok Tengah</text>

  <g transform="translate(225, 374)">
    <rect x="0" y="0" width="350" height="32" rx="8" fill="#24364D" stroke="#CBD5E1" stroke-opacity="0.22" stroke-width="1" />
    <text x="175" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#F3EBDD" text-anchor="middle" letter-spacing="1.4">TIKUM.APP · VERIFIED SPORTS EVENT</text>
  </g>
</svg>
